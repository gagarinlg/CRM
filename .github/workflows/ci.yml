name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

  # ── 2. Unit Tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-access-32chars!!!!
          JWT_REFRESH_SECRET: ci-test-secret-refresh-32chars!!!

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── 3. UI / E2E Tests ─────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: crm_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run migrations and seed
        run: |
          npm run migrate
          npm run seed
        env:
          NODE_ENV: development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: crm_db
          DB_USER: crm_user
          DB_PASSWORD: crm_password

      - name: Build frontend
        working-directory: src/client
        run: npm run build

      - name: Start backend server
        run: node src/server/index.js &
        env:
          NODE_ENV: production
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: crm_db
          DB_USER: crm_user
          DB_PASSWORD: crm_password
          JWT_SECRET: ci-e2e-secret-access-key-32chars!!
          JWT_REFRESH_SECRET: ci-e2e-secret-refresh-key-32chars!
          FRONTEND_URL: http://localhost:5173

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:3000/health && break
            sleep 2
          done

      - name: Serve frontend (static)
        run: npx serve src/client/dist -p 5173 &
        env:
          NODE_ENV: production

      - name: Wait for frontend
        run: sleep 5

      - name: Run Playwright tests
        run: npm run test:e2e -- --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          SKIP_SERVER_START: "true"
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
